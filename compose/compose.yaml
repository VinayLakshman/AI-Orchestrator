services:
  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-orchestrator
    env_file:
      - ../.env
    environment:
      APP_PORT: 8000
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
